name: publish
# Publishes a SepiaDoc release under GitHub's own automation account, so no person's name appears on the public
# releases page. Run with:
#   gh workflow run publish.yml -f tag=v1.2.3 -f url=https://download.sepiadoc.com/1.2.3/SepiaDoc-Setup-1.2.3.exe
#     -f sha256=<hash> -f notes_b64=<plain-English notes, base64>
# Every input is checked before use and none is ever pasted into a shell command (they arrive as environment
# variables). The installer must come from SepiaDoc's own download server, match its SHA-256 and carry Mako Logics
# LLC's Azure Trusted Signing identity. A release is only marked "Latest" if it really is the newest version, so
# republishing an old one can't freeze updates.
on:
  workflow_dispatch:
    inputs:
      tag: { description: "Tag, e.g. v0.9.5", required: true }
      url: { description: "https://download.sepiadoc.com/<version>/SepiaDoc-Setup-<version>.exe", required: true }
      sha256: { description: "The installer's SHA-256", required: true }
      notes_b64: { description: "Release notes, base64", required: true }
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      URL: ${{ inputs.url }}
      SHA: ${{ inputs.sha256 }}
      NOTES_B64: ${{ inputs.notes_b64 }}
      IDENTITY: "1.3.6.1.4.1.311.97.8697066.856025720.285375431.945967033"
    steps:
      - name: Check the inputs
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "The tag must look like v1.2.3"; exit 1; }
          version="${TAG#v}"
          [[ "$URL" == "https://download.sepiadoc.com/$version/SepiaDoc-Setup-$version.exe" ]] || { echo "The installer must come from https://download.sepiadoc.com/$version/"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "sha256 must be 64 lower-case hexadecimal digits"; exit 1; }
          printf '%s' "$NOTES_B64" | base64 -d > notes.md || { echo "The notes must be base64"; exit 1; }
          [ -s notes.md ] || { echo "The notes are empty"; exit 1; }
      - name: Fetch and check the installer
        run: |
          name="SepiaDoc-Setup-${TAG#v}.exe"
          curl -fsSL --proto '=https' --max-filesize 524288000 -o "$name" "$URL"
          echo "$SHA  $name" | sha256sum -c -
          sudo apt-get install -y -qq osslsigncode > /dev/null
          osslsigncode extract-signature -in "$name" -out signature.der > /dev/null
          openssl pkcs7 -inform DER -in signature.der -print_certs -text -noout > certificates.txt
          grep -Eq 'Subject:.*O ?= ?Mako Logics LLC' certificates.txt || { echo "The installer isn't signed by Mako Logics LLC"; exit 1; }
          grep -Fq "$IDENTITY" certificates.txt || { echo "The installer isn't signed with Mako Logics LLC's Trusted Signing identity"; exit 1; }
          echo "NAME=$name" >> "$GITHUB_ENV"
      - name: Publish the release
        run: |
          latest="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || echo v0.0.0)"
          newest="$(printf '%s\n%s\n' "${latest#v}" "${TAG#v}" | sort -V | tail -n 1)"
          if [ "$newest" = "${TAG#v}" ]; then mark="--latest"; else mark="--latest=false"; fi
          # Republishing keeps the existing tag (release tags can't be moved or deleted: a repository rule).
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes || true
          gh release create "$TAG" "$NAME" -R "$GITHUB_REPOSITORY" --title "SepiaDoc ${TAG#v}" --notes-file notes.md "$mark"
