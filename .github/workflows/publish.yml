name: publish
# Publishes a SepiaDoc release under GitHub's own automation account, so no person's name appears on the public
# releases page. The signed installer is fetched from a staging address, its SHA-256 must match, then the release is
# (re)created with it. Run with: gh workflow run publish.yml -f tag=v1.2.3 -f url=<installer> -f sha256=<hash> -f notes_b64=<base64>
on:
  workflow_dispatch:
    inputs:
      tag: { description: "Tag, e.g. v0.9.1", required: true }
      url: { description: "Where to fetch the signed installer from", required: true }
      sha256: { description: "The installer's SHA-256", required: true }
      notes_b64: { description: "Release notes, base64", required: true }
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      URL: ${{ inputs.url }}
      SHA: ${{ inputs.sha256 }}
    steps:
      - name: Fetch and check the installer
        run: |
          name="SepiaDoc-Setup-${TAG#v}.exe"
          curl -fsSL -o "$name" "$URL"
          echo "$SHA  $name" | sha256sum -c -
          echo "NAME=$name" >> "$GITHUB_ENV"
      - name: Publish the release
        run: |
          echo "${{ inputs.notes_b64 }}" | base64 -d > notes.md
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$TAG" && sleep 5 || true
          gh release create "$TAG" "$NAME" -R "$GITHUB_REPOSITORY" --title "SepiaDoc ${TAG#v}" --notes-file notes.md --latest
